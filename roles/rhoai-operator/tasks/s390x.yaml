---
- name: Install RHOAI operator
  tags: install
  block:

    - name: Create rhoai-operator namespace
      kubernetes.core.k8s:
        state: present
        src: "files/namespace.yaml"

    - name: Create operator group
      kubernetes.core.k8s:
        state: present
        src: "files/operator-group.yaml"

    - name: Create subscription
      kubernetes.core.k8s:
        state: present
        src: "files/s390x/subscription.yaml"

    # TODO - this may not be the best way to check if operator is ready,
    #       Consider checking the status of the ClusterServiceVersion.
    - name: Wait for at least one RHOAI operator pod to be Running
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: redhat-ods-operator
        label_selectors:
          - "name=rhods-operator"
      register: rhods_operator_pods
      retries: 40      # try up to 40 times
      delay: 15        # wait 15s between attempts
      until: >
        rhods_operator_pods.resources | selectattr('status.phase','equalto','Running') | list | length > 0

    - name: Apply default-dsci DSCInitialization
      kubernetes.core.k8s:
        state: present
        src: "files/s390x/default-dsci.yaml"

    - name: Wait until default-dsci DSCInitialization is Ready
      kubernetes.core.k8s_info:
        api_version: dscinitialization.opendatahub.io/v2
        kind: DSCInitialization
        namespace: redhat-ods-applications
        name: default-dsci
      register: dsci_status
      retries: 30
      delay: 20
      until: >
        dsci_status.resources | length > 0 and
        dsci_status.resources[0].status is defined and
        dsci_status.resources[0].status.phase is defined and
        dsci_status.resources[0].status.phase | lower == "ready"

    - name: Apply the default DataScienceCluster
      kubernetes.core.k8s:
        state: present
        src: "files/s390x/default-dsc.yaml"

    - name: Wait until DataScienceCluster default-dsc is Ready
      kubernetes.core.k8s_info:
        api_version: datasciencecluster.opendatahub.io/v2
        kind: DataScienceCluster
        name: default-dsc
        namespace: redhat-ods-applications
      register: dsc_status
      retries: 30
      delay: 20
      until: >
        dsc_status.resources | length > 0 and
        dsc_status.resources[0].status.phase is defined and
        dsc_status.resources[0].status.phase | lower == "ready"

    - name: Show DataScienceCluster phase
      debug:
        msg: "default-dsc phase = {{ dsc_status.resources[0].status.phase }}"

    - name: Wait until key RHOAI/KServe pods are Running
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: redhat-ods-applications
        label_selectors:
          - "app in (kserve-controller-manager, kubeflow-training-operator, odh-model-controller)"
      register: ods_pods
      retries: 40
      delay: 30
      until: >
        ods_pods.resources | length > 0 and
        (ods_pods.resources | map(attribute='status.phase') | list | select('equalto', 'Running') | list | length) == ods_pods.resources | length

    - name: Check if any pods exist in redhat-ods-applications
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: redhat-ods-applications
      register: ods_pods
      failed_when: ods_pods.resources | length == 0

# WARNING: uninstall not tested
- name: Uninstall RHOAI operator + resources
  tags: uninstall
  block:

    - name: Delete default DataScienceCluster
      kubernetes.core.k8s:
        state: absent
        src: "files/s390x/default-dsc.yaml"

    - name: Delete default-dsci DSCInitialization
      kubernetes.core.k8s:
        state: absent
        src: "files/s390x/default-dsci.yaml"

    - name: Delete subscription
      kubernetes.core.k8s:
        state: absent
        src: "files/s390x/subscription.yaml"

    - name: Delete operator group
      kubernetes.core.k8s:
        state: absent
        src: "files/s390x/operator-group.yaml"

    - name: Delete rhoai-operator namespace
      kubernetes.core.k8s:
        state: absent
        src: "files/s390x/namespace.yaml"

    - name: Wait until all RHOAI operator pods are deleted
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: redhat-ods-operator
        label_selectors:
          - "name=rhods-operator"
      register: rhods_operator_pods
      retries: 40
      delay: 15
      until: rhods_operator_pods.resources | length == 0

    - name: Wait until all pods in redhat-ods-applications are deleted
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: redhat-ods-applications
      register: ods_pods
      retries: 40
      delay: 15
      until: ods_pods.resources | length == 0