---
- name: Run installation steps for Fusion Data Foundation
  tags: install
  block:
    - name: Create ibm-operator-catalog CatalogSource
      kubernetes.core.k8s:
        state: present
        src: files/catalog-source.yaml

    - name: Wait for CatalogSource to be ready
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: ibm-operator-catalog
        namespace: openshift-marketplace
      register: catalog_source_info
      until: >-
        catalog_source_info.resources | length > 0 and
        (catalog_source_info.resources[0].status is defined) and
        (catalog_source_info.resources[0].status.connectionState is defined) and
        (catalog_source_info.resources[0].status.connectionState.lastObservedState == 'READY')
      retries: 30
      delay: 10

- name: Run uninstall steps for Fusion Data Foundation
  tags: uninstall
  block:
    - name: Delete ibm-operator-catalog CatalogSource
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: CatalogSource
        name: ibm-operator-catalog
        namespace: openshift-marketplace
