---
# get-cpd-credentials role
# Fetches CPD admin credentials and API key from cluster secrets and displays them.
#
# Secrets read:
#   - ibm-iam-bindinfo-platform-auth-idp-credentials  (namespace: cpd_instance_ns)
#     → cpd_username (admin_username field)
#     → cpd_password (admin_password field)
#   - cpd-api-key  (namespace: cpd_instance_ns)
#     → cpd_api_key (cpd-api-key field)
- name: Run steps for installing the cert-manager Operator
  tags: get-cpd-credentials
  block: 
      
    - name: Get CPD admin credentials secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: ibm-iam-bindinfo-platform-auth-idp-credentials
        namespace: "{{ cpd_instance_ns }}"
      register: cpd_credentials_secret

    - name: Fail if CPD credentials secret not found
      ansible.builtin.fail:
        msg: "Secret 'ibm-iam-bindinfo-platform-auth-idp-credentials' not found in namespace '{{ cpd_instance_ns }}'"
      when: cpd_credentials_secret.resources | length == 0

    - name: Get CPD API key secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: cpd-api-key
        namespace: "{{ cpd_instance_ns }}"
      register: cpd_api_key_secret

    - name: Fail if CPD API key secret not found
      ansible.builtin.fail:
        msg: "Secret 'cpd-api-key' not found in namespace '{{ cpd_instance_ns }}'. Run the create-wxo-instance role first."
      when: cpd_api_key_secret.resources | length == 0

    - name: Extract CPD credentials
      ansible.builtin.set_fact:
        cpd_username: "{{ cpd_credentials_secret.resources[0].data.admin_username | b64decode }}"
        cpd_password: "{{ cpd_credentials_secret.resources[0].data.admin_password | b64decode }}"
        cpd_api_key: "{{ cpd_api_key_secret.resources[0].data['cpd-api-key'] | b64decode }}"
      no_log: true

    - name: Display CPD credentials
      ansible.builtin.debug:
        msg:
          - "Namespace : {{ cpd_instance_ns }}"
          - "Username  : {{ cpd_username }}"
          - "Password  : {{ cpd_password }}"
          - "API Key   : {{ cpd_api_key }}"
