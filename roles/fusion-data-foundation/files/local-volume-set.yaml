apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  finalizers:
    - storage.openshift.com/local-volume-protection
  name: "{{ fdf_storage_class }}"
  namespace: "{{ fdf_local_storage_namespace }}"
spec:
  deviceInclusionSpec:
    deviceTypes:
      - disk
    minSize: "{{ fdf_min_disk_size }}"
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
         - key: cluster.ocs.openshift.io/openshift-storage
           operator: In
           values:
             - ""
  storageClassName: "{{ fdf_storage_class }}"
  volumeMode: Block