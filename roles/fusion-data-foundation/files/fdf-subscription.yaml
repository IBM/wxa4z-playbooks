apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  labels:
    operators.coreos.com/{{ fdf_subscription_name }}.{{ fdf_namespace }}: ''
  name: "{{ fdf_subscription_name }}"
  namespace: "{{ fdf_namespace }}"
spec:
  channel: "{{ fdf_channel }}"
  installPlanApproval: "{{ fdf_install_plan_approval }}"
  name: "{{ fdf_subscription_name }}"
  source: "{{ fdf_catalog_source }}"
  sourceNamespace: openshift-marketplace
