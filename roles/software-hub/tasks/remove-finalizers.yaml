---
# Remove finalizers from resources in cpd-instance-1 namespace

- name: Remove finalizers from authentications.operator.ibm.com in cpd-instance-1
  ansible.builtin.shell: |
    oc get authentications.operator.ibm.com -n cpd-instance-1 -o name | xargs -r -I {} oc patch {} -p '{"metadata":{"finalizers":[]}}' --type=merge -n cpd-instance-1
  ignore_errors: true
  changed_when: false

- name: Remove finalizers from ccs.ccs.cpd.ibm.com in cpd-instance-1
  ansible.builtin.shell: |
    oc get ccs.ccs.cpd.ibm.com -n cpd-instance-1 -o name | xargs -r -I {} oc patch {} -p '{"metadata":{"finalizers":[]}}' --type=merge -n cpd-instance-1
  ignore_errors: true
