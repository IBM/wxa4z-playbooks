- name: Check if zenclient-{{ cpd_instance_ns }} exists
  ansible.builtin.command: >
    oc get client.oidc.security.ibm.com zenclient-{{ cpd_instance_ns }}
    -n {{ cpd_instance_ns }}
  register: zenclient_check
  ignore_errors: true
  changed_when: false

- name: Remove finalizers from zenclient-cpd-instance-1 client.oidc.security.ibm.com
  ansible.builtin.command: >
    oc patch client.oidc.security.ibm.com zenclient-{{ cpd_instance_ns }}
    -n {{ cpd_instance_ns }}
    --type=merge
    -p '{"metadata":{"finalizers":null}}'
  when: zenclient_check.rc == 0
  changed_when: false

