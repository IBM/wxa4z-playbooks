- name: Create dockerconfigjson secret in operator namespace
  kubernetes.core.k8s:
    state: present
    namespace: "{{ cpd_operators_ns }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ software_hub_image_pull_secret }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{
            {
              "auths": {
                software_hub_image_pull_prefix: {
                  "username": software_hub_docker_username,
                  "password": entitlement_key,
                  "auth": (software_hub_docker_username + ':' + entitlement_key) | b64encode
                }
              }
            } | to_json | b64encode
          }}

- name: Create dockerconfigjson secret in instance namespace
  kubernetes.core.k8s:
    state: present
    namespace: "{{ cpd_instance_ns }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ software_hub_image_pull_secret }}"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{
            {
              "auths": {
                software_hub_image_pull_prefix: {
                  "username": software_hub_docker_username,
                  "password": entitlement_key,
                  "auth": (software_hub_docker_username + ':' + entitlement_key) | b64encode
                }
              }
            } | to_json | b64encode
          }}
