---
# =============================================================================
# RHAIIS-SPECIFIC CONFIGURATION
# Reference: https://www.ibm.com/docs/en/watsonx/waz/3.2.0?topic=gateway-configure-red-hat-ai-inference-server-model-connection
# =============================================================================

# -------------------------------------------------------------------------
# Validation
# -------------------------------------------------------------------------

- name: Validate RHAIIS required variables
  ansible.builtin.fail:
    msg: "RHAIIS requires '{{ item.name }}' to be set (non-empty). Set it in vars/global.yaml."
  when: item.value is not defined or item.value == ''
  loop:
    - { name: rhaiis_inferencing_endpoint, value: "{{ rhaiis_inferencing_endpoint | default('') }}" }
    - { name: rhaiis_api_key,              value: "{{ rhaiis_api_key              | default('') }}" }

# -------------------------------------------------------------------------
# Step 1: Add Connection
# -------------------------------------------------------------------------

- name: Add RHAIIS connection
  ansible.builtin.command: >
    orchestrate connections add
    -a {{ connection_name }}
  register: connection_add_result
  changed_when: "'Creating connection' in connection_add_result.stdout and connection_add_result.rc == 0"
  failed_when: connection_add_result.rc != 0 and 'already exists' not in connection_add_result.stdout

# -------------------------------------------------------------------------
# Step 2: Configure Connection (Draft and Live)
# -------------------------------------------------------------------------

- name: Configure RHAIIS connection for draft environment
  ansible.builtin.command: >
    orchestrate connections configure
    -a {{ connection_name }}
    --kind=key_value
    --env=draft
    --type=team
  register: connection_config_draft_result
  changed_when: connection_config_draft_result.rc == 0 and 'Existing connection' not in connection_config_draft_result.stdout
  failed_when: false

- name: Configure RHAIIS connection for live environment
  ansible.builtin.command: >
    orchestrate connections configure
    -a {{ connection_name }}
    --kind=key_value
    --env=live
    --type=team
  register: connection_config_live_result
  changed_when: connection_config_live_result.rc == 0 and 'Existing connection' not in connection_config_live_result.stdout
  failed_when: false

# -------------------------------------------------------------------------
# Step 3: Set Credentials for Connection (Draft and Live)
# NOTE: RHAIIS only requires api_key
# -------------------------------------------------------------------------

- name: Set RHAIIS credentials for draft environment
  ansible.builtin.command: >
    orchestrate connections set-credentials
    -a {{ connection_name }}
    --env draft
    -e api_key={{ rhaiis_api_key }}
  register: credentials_draft_result
  changed_when: credentials_draft_result.rc == 0
  failed_when: false
  no_log: true

- name: Set RHAIIS credentials for live environment
  ansible.builtin.command: >
    orchestrate connections set-credentials
    -a {{ connection_name }}
    --env live
    -e api_key={{ rhaiis_api_key }}
  register: credentials_live_result
  changed_when: credentials_live_result.rc == 0
  failed_when: false
  no_log: true

# -------------------------------------------------------------------------
# Step 4: Template and Import the Granite Model
# Uses rhaiis_inferencing_endpoint from vars/global.yaml
# -------------------------------------------------------------------------

- name: Template rhaiis-granite-4.1-8b.yaml with RHAIIS endpoint
  ansible.builtin.template:
    src: "{{ role_path }}/templates/rhaiis-granite-4.1-8b.yaml.j2"
    dest: "/tmp/granite-rhaiis-model.yaml"

- name: Read templated file contents
  ansible.builtin.slurp:
    src: "/tmp/granite-rhaiis-model.yaml"
  register: templated_content

- name: Display templated model file contents
  ansible.builtin.debug:
    msg: "{{ templated_content['content'] | b64decode }}"

- name: Import granite model for RHAIIS
  ansible.builtin.command: >
    orchestrate models import
    --file /tmp/granite-rhaiis-model.yaml
    --app-id {{ connection_name }}
  register: model_import_result
  changed_when: model_import_result.rc == 0 and 'Existing model' not in model_import_result.stdout
  failed_when: model_import_result.rc != 0 and 'Conflict' not in model_import_result.stderr and 'default' not in model_import_result.stderr
  retries: 5
  delay: 10
  until: >-
    model_import_result.rc == 0
    or 'Conflict' in model_import_result.stderr
    or 'default' in model_import_result.stderr

- name: Clean up templated file
  ansible.builtin.file:
    path: "/tmp/granite-rhaiis-model.yaml"
    state: absent

- name: Display RHAIIS configuration completion
  ansible.builtin.debug:
    msg: |
      {% if model_import_result.rc == 0 and 'Existing model' not in model_import_result.stdout %}
      ============================================================
      Model Gateway configuration for RHAIIS completed successfully!
      
      Environment: {{ environment_name }}
      Connection: {{ connection_name }}
      Model: openai/ibm/granite-4.1-8b
      RHAIIS Endpoint: {{ rhaiis_inferencing_endpoint }}
      Status: Model imported successfully
      ============================================================
      {% elif model_import_result.rc == 0 and 'Existing model' in model_import_result.stdout %}
      ============================================================
      Model Gateway configuration for RHAIIS completed!
      
      Environment: {{ environment_name }}
      Connection: {{ connection_name }}
      Model: openai/ibm/granite-4.1-8b
      RHAIIS Endpoint: {{ rhaiis_inferencing_endpoint }}
      Status: Model already exists and was updated
      ============================================================
      {% elif model_import_result.rc != 0 and 'Conflict' in model_import_result.stderr %}
      ============================================================
      Model import skipped (already exists as default LLM)
      
      No changes made to Model Gateway configuration.
      The model is already configured and active.
      
      Environment: {{ environment_name }}
      Connection: {{ connection_name }}
      Model: openai/ibm/granite-4.1-8b
      RHAIIS Endpoint: {{ rhaiis_inferencing_endpoint }}
      ============================================================
      {% endif %}
